<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Personal AI</title>
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --accent: #2563eb; --user-bg: #2563eb; --user-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --surface: #292524; --text: #f5f5f4; --muted: #a8a29e;
      --border: #44403c; --accent: #60a5fa; --user-bg: #1d4ed8; --user-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
  }
  [hidden] { display: none !important; }
  header button { background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; }
  .tabs { display: flex; gap: 4px; background: var(--border); border-radius: 10px; padding: 2px; }
  .tabs button { color: var(--text); padding: 4px 14px; border-radius: 8px; font-weight: 600; }
  .tabs button[aria-current="page"] { background: var(--surface); }
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); white-space: pre-wrap; }
  .assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
  .assistant p { margin: 0 0 8px; } .assistant p:last-child { margin-bottom: 0; }
  .assistant ul { margin: 0 0 8px; padding-left: 20px; }
  .assistant h3 { font-size: 16px; margin: 8px 0 4px; }
  .assistant code { font-size: 14px; }
  details { color: var(--muted); font-size: 14px; margin-bottom: 8px; white-space: pre-wrap; }
  summary { cursor: pointer; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .error { color: #dc2626; }
  .empty { color: var(--muted); text-align: center; margin: auto; padding: 0 24px; }
  #form, .journal {
    display: flex; gap: 8px; padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border);
  }
  .journal { padding-bottom: 12px; border-top: none; border-bottom: 1px solid var(--border); }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px; padding: 9px 14px; max-height: 40vh;
  }
  .primary {
    background: var(--accent); color: #fff; border: none; border-radius: 20px;
    padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .primary:disabled { opacity: .5; }
  .secondary {
    background: none; color: var(--muted); border: 1px solid var(--border); border-radius: 20px;
    padding: 0 12px; font: inherit; cursor: pointer;
  }
  #think[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .list li { display: flex; border-bottom: 1px solid var(--border); }
  .list button {
    flex: 1; min-width: 0; text-align: left; background: none; border: none;
    padding: 12px 16px; font: inherit; color: var(--text); cursor: pointer; overflow-wrap: anywhere;
  }
  .list button.remove { flex: none; white-space: nowrap; color: var(--muted); padding: 12px 16px; }
  .list small { display: block; color: var(--muted); font-size: 13px; }
  .list li.folder {
    padding: 14px 16px 4px; color: var(--muted); font-size: 13px; font-weight: 600; border-bottom: none;
  }
  .feedback { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 13px; }
  .feedback button {
    background: none; border: 1px solid transparent; border-radius: 12px; padding: 2px 8px;
    font: inherit; color: var(--muted); cursor: pointer;
  }
  .feedback .rate { filter: grayscale(1); opacity: .6; }
  .feedback .rate[aria-pressed="true"] { filter: none; opacity: 1; border-color: var(--border); }
  .feedback-panel { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; font-size: 14px; }
  .feedback-panel label { color: var(--muted); font-size: 13px; }
  .feedback-panel textarea { border-radius: 8px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: none; border: 1px solid var(--border); border-radius: 14px; padding: 3px 10px;
    font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .feedback-panel .primary { align-self: flex-end; height: 34px; }
  .status { color: var(--muted); font-size: 13px; padding: 6px 16px; min-height: 1.5em; }
  .status button { background: none; border: none; color: var(--accent); font: inherit; padding: 0; cursor: pointer; }
  #editor-pane { padding: 0 16px 16px; gap: 10px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .editor-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; }
  .editor-bar .status { padding: 0; text-align: right; }
  #back { white-space: nowrap; flex-shrink: 0; height: 36px; }
  #editor-path {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  }
  #editor-path[readonly] { color: var(--muted); }
  #editor { border-radius: 8px; max-height: none; font-size: 15px; }
  .editor-actions { display: flex; justify-content: space-between; height: 40px; }
  #delete { color: #dc2626; }
</style>
</head>
<body>
<header>
  <nav class="tabs">
    <button type="button" data-view="chat" aria-current="page">Chat</button>
    <button type="button" data-view="notes">Notes</button>
    <button type="button" data-view="history">History</button>
  </nav>
  <button id="new" type="button">New chat</button>
</header>
<section id="chat-view" class="view">
  <main id="log"><p class="empty">Ask about your notes, plans or journal.</p></main>
  <form id="form">
    <button id="think" class="secondary" type="button" aria-pressed="false" title="Think carefully before answering (slower)">Think</button>
    <textarea id="input" rows="1" placeholder="Message" autofocus></textarea>
    <button id="send" class="primary">Send</button>
  </form>
</section>
<section id="notes-view" class="view" hidden>
  <div id="list-pane" class="view">
    <form id="journal-form" class="journal">
      <textarea id="journal-input" rows="1" placeholder="Journal: how's today going?"></textarea>
      <button class="primary">Add</button>
    </form>
    <div id="list-status" class="status"></div>
    <ul id="notes-list" class="list"></ul>
  </div>
  <div id="editor-pane" class="view" hidden>
    <div class="editor-bar">
      <button id="back" type="button" class="secondary">‹ Notes</button>
      <span id="editor-status" class="status"></span>
    </div>
    <input id="editor-path" placeholder="folder/name.md" autocapitalize="off" autocorrect="off" spellcheck="false">
    <textarea id="editor"></textarea>
    <div class="editor-actions">
      <button id="delete" type="button" class="secondary">Delete</button>
      <button id="save" type="button" class="primary">Save</button>
    </div>
  </div>
</section>
<section id="history-view" class="view" hidden>
  <div id="history-status" class="status"></div>
  <ul id="history-list" class="list"></ul>
</section>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const thinkButton = document.getElementById("think");
// The server keeps the history; the page only remembers which conversation
// it's in, so a reload (or another device) picks up where you left off.
let conversationId = null;

function rememberConversation(id) {
  conversationId = id;
  try {
    if (id) localStorage.setItem("conversationId", id);
    else localStorage.removeItem("conversationId");
  } catch {}  // Storage can be unavailable (e.g. private browsing); the chat still works.
}

thinkButton.addEventListener("click", () => {
  thinkButton.setAttribute("aria-pressed", String(thinkButton.getAttribute("aria-pressed") !== "true"));
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

// Just enough Markdown for the model's answers. Text is escaped first, so the
// model's output can never inject HTML into the page.
function renderMarkdown(text) {
  const inline = s => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  let html = "", list = false;
  for (const line of escapeHtml(text).split("\n")) {
    const item = line.match(/^\s*[*-]\s+(.*)/);
    if (item) {
      if (!list) { html += "<ul>"; list = true; }
      html += `<li>${inline(item[1])}</li>`;
      continue;
    }
    if (list) { html += "</ul>"; list = false; }
    const heading = line.match(/^#{1,6}\s+(.*)/);
    if (heading) html += `<h3>${inline(heading[1])}</h3>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? "</ul>" : "");
}

function addBubble(cls) {
  log.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = `msg ${cls}`;
  log.appendChild(el);
  return el;
}

function scrollToBottom() { log.scrollTop = log.scrollHeight; }

function assistantBubble() {
  const bubble = addBubble("assistant");
  const thinking = document.createElement("details");
  thinking.innerHTML = "<summary>Thinking…</summary>";
  const thinkingText = document.createElement("div");
  thinking.appendChild(thinkingText);
  const answerEl = document.createElement("div");
  const meta = document.createElement("div");
  meta.className = "meta";
  bubble.append(thinking, answerEl, meta);
  return {bubble, thinking, thinkingText, answerEl, meta};
}

const REASONS = {
  wrong_fact: "Wrong fact", missed_notes: "Missed my notes", made_up: "Made something up",
  too_long: "Too long", not_helpful: "Not helpful", tone: "Tone",
};

// 👍/👎 is one tap. Details (reasons, a comment, or a corrected answer) are
// optional: a corrected answer is both a training example and a preference
// pair (yours over the model's) for fine-tuning later.
function addFeedback(bubble, messageId, answer, saved) {
  const state = {rating: null, reasons: [], comment: null, correction: null, ...saved};
  const row = document.createElement("div");
  row.className = "feedback";
  const panel = document.createElement("div");
  panel.className = "feedback-panel";
  panel.hidden = true;
  const status = document.createElement("span");

  async function save() {
    const response = await fetch(`/api/messages/${messageId}/feedback`, {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(state),
    });
    status.textContent = response.ok ? "Saved" : `Failed (${response.status})`;
  }

  const rateButtons = [[1, "👍"], [-1, "👎"]].map(([rating, label]) => {
    const button = document.createElement("button");
    button.className = "rate";
    button.textContent = label;
    button.setAttribute("aria-label", rating === 1 ? "Good answer" : "Bad answer");
    button.addEventListener("click", () => {
      state.rating = state.rating === rating ? null : rating;
      rateButtons.forEach(([r, b]) => b.setAttribute("aria-pressed", String(state.rating === r)));
      if (state.rating === -1) panel.hidden = false;
      save();
    });
    return [rating, button];
  });
  rateButtons.forEach(([r, b]) => b.setAttribute("aria-pressed", String(state.rating === r)));
  const detailsButton = document.createElement("button");
  detailsButton.textContent = "Details";
  detailsButton.addEventListener("click", () => { panel.hidden = !panel.hidden; });
  row.append(...rateButtons.map(([, b]) => b), detailsButton, status);

  const chips = document.createElement("div");
  chips.className = "chips";
  for (const [key, label] of Object.entries(REASONS)) {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = label;
    chip.setAttribute("aria-pressed", String(state.reasons.includes(key)));
    chip.addEventListener("click", () => {
      state.reasons = state.reasons.includes(key)
        ? state.reasons.filter(r => r !== key) : [...state.reasons, key];
      chip.setAttribute("aria-pressed", String(state.reasons.includes(key)));
    });
    chips.appendChild(chip);
  }
  const comment = document.createElement("textarea");
  comment.placeholder = "What was wrong or missing? (optional)";
  comment.value = state.comment || "";
  const correctionLabel = document.createElement("label");
  correctionLabel.textContent = "Better answer (optional, edit the model's answer):";
  const correction = document.createElement("textarea");
  correction.rows = 5;
  correction.value = state.correction || answer;
  const saveButton = document.createElement("button");
  saveButton.className = "primary";
  saveButton.textContent = "Save feedback";
  saveButton.addEventListener("click", () => {
    state.comment = comment.value.trim() || null;
    // Only an actual edit counts as a correction.
    state.correction = correction.value.trim() && correction.value.trim() !== answer.trim()
      ? correction.value.trim() : null;
    save();
  });
  panel.append(chips, comment, correctionLabel, correction, saveButton);
  bubble.append(row, panel);
}

function renderConversation(conversation) {
  log.innerHTML = "";
  for (const message of conversation.messages) {
    if (message.role === "user") {
      addBubble("user").textContent = message.content;
      continue;
    }
    const {bubble, thinking, thinkingText, answerEl} = assistantBubble();
    if (message.reasoning) {
      thinking.querySelector("summary").textContent = "Thought process";
      thinkingText.textContent = message.reasoning;
    } else {
      thinking.remove();
    }
    answerEl.innerHTML = renderMarkdown(message.content);
    addFeedback(bubble, message.id, message.content, message.feedback);
  }
  if (!conversation.messages.length) startNewChat();
  scrollToBottom();
}

async function openConversation(id) {
  const response = await fetch(`/api/conversations/${encodeURIComponent(id)}`);
  if (!response.ok) { startNewChat(); return; }  // e.g. deleted on another device
  rememberConversation(id);
  renderConversation(await response.json());
}

function startNewChat() {
  rememberConversation(null);
  log.innerHTML = '<p class="empty">Ask about your notes, plans or journal.</p>';
}

async function ask(question, think) {
  addBubble("user").textContent = question;
  const {bubble, thinking, thinkingText, answerEl, meta} = assistantBubble();
  scrollToBottom();

  const start = performance.now();
  let answer = "", firstToken = null;
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({conversation_id: conversationId, message: question, think}),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffered = "";
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buffered += value;
      const lines = buffered.split("\n");
      buffered = lines.pop();
      for (const line of lines.filter(Boolean)) {
        const {kind, value} = JSON.parse(line);
        if (kind === "reasoning" || kind === "content") firstToken ??= performance.now();
        if (kind === "reasoning") thinkingText.textContent += value;
        else if (kind === "content") {
          if (!answer) thinking.querySelector("summary").textContent = "Thought process";
          answer += value;
          answerEl.innerHTML = renderMarkdown(answer);
        } else if (kind === "timings") {
          meta.textContent = `${value.cache_n + value.prompt_n} prompt tokens · first token ` +
            `${((firstToken - start) / 1000).toFixed(1)}s · ${Math.round(value.predicted_per_second)} tok/s`;
        } else if (kind === "saved") {
          rememberConversation(value.conversation_id);
          addFeedback(bubble, value.message_id, answer);
        } else if (kind === "error") {
          throw new Error(value);
        }
        scrollToBottom();
      }
    }
    if (!thinkingText.textContent) thinking.remove();
  } catch (error) {
    // Nothing was saved for this turn; the next message continues from the
    // last saved one.
    thinking.remove();
    answerEl.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question || send.disabled) return;
  input.value = "";
  input.style.height = "";
  send.disabled = true;
  // Thinking applies to one message, then switches back off.
  const think = thinkButton.getAttribute("aria-pressed") === "true";
  thinkButton.setAttribute("aria-pressed", "false");
  await ask(question, think);
  send.disabled = false;
});

// Enter sends on a keyboard; Shift+Enter adds a line. On the phone, use Send.
input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing && matchMedia("(pointer: fine)").matches) {
    event.preventDefault();
    form.requestSubmit();
  }
});
input.addEventListener("input", () => {
  input.style.height = "";
  input.style.height = input.scrollHeight + "px";
});

// ---- Views ----

const newButton = document.getElementById("new");
let view = "chat";

function showView(name) {
  view = name;
  for (const tab of document.querySelectorAll(".tabs button")) {
    if (tab.dataset.view === name) tab.setAttribute("aria-current", "page");
    else tab.removeAttribute("aria-current");
  }
  document.getElementById("chat-view").hidden = name !== "chat";
  document.getElementById("notes-view").hidden = name !== "notes";
  document.getElementById("history-view").hidden = name !== "history";
  newButton.textContent = name === "notes" ? "New note" : "New chat";
  if (name === "notes") loadNotes();
  if (name === "history") loadHistory();
}

for (const tab of document.querySelectorAll(".tabs button")) {
  tab.addEventListener("click", () => {
    if (tab.dataset.view !== view && confirmDiscard()) { closeEditor(); showView(tab.dataset.view); }
  });
}

newButton.addEventListener("click", () => {
  if (view !== "notes") {
    startNewChat();
    showView("chat");
  } else if (confirmDiscard()) {
    openEditor({path: "", content: "# ", etag: null});
  }
});

// ---- History ----

const historyList = document.getElementById("history-list");
const historyStatus = document.getElementById("history-status");

async function loadHistory() {
  const conversations = await (await fetch("/api/conversations")).json();
  historyStatus.textContent = conversations.length ? "" : "No conversations yet.";
  historyList.innerHTML = "";
  for (const conversation of conversations) {
    const item = document.createElement("li");
    const open = document.createElement("button");
    open.textContent = conversation.title;
    const detail = document.createElement("small");
    detail.textContent = timeAgo(Date.parse(conversation.updated_at) / 1000);
    open.appendChild(detail);
    open.addEventListener("click", async () => {
      await openConversation(conversation.id);
      showView("chat");
    });
    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "Delete";
    remove.setAttribute("aria-label", `Delete "${conversation.title}"`);
    remove.addEventListener("click", async () => {
      if (!confirm(`Delete "${conversation.title}"? This can't be undone.`)) return;
      const response = await fetch(`/api/conversations/${encodeURIComponent(conversation.id)}`, {method: "DELETE"});
      if (!response.ok) { historyStatus.textContent = `Delete failed (${response.status})`; return; }
      if (conversation.id === conversationId) startNewChat();
      loadHistory();
    });
    item.append(open, remove);
    historyList.appendChild(item);
  }
}

// ---- Notes ----

const listPane = document.getElementById("list-pane");
const listStatus = document.getElementById("list-status");
const notesList = document.getElementById("notes-list");
const editorPane = document.getElementById("editor-pane");
const editorPath = document.getElementById("editor-path");
const editor = document.getElementById("editor");
const editorStatus = document.getElementById("editor-status");
// The open note. etag is the version we loaded; null means a new, unsaved note.
let current = null;

// Encode "/" too, so the browser can't collapse "../" before the server sees
// (and rejects) it.
const encodePath = path => encodeURIComponent(path);

function timeAgo(seconds) {
  const minutes = Math.round((Date.now() / 1000 - seconds) / 60);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes} min ago`;
  if (minutes < 60 * 24) return `${Math.round(minutes / 60)} h ago`;
  return new Date(seconds * 1000).toLocaleDateString();
}

async function loadNotes() {
  const response = await fetch("/api/notes");
  // Group by folder: top-level notes first, then folders A–Z. The server
  // already sorts newest first, which each group keeps.
  const groups = new Map();
  for (const note of await response.json()) {
    const folder = note.path.includes("/") ? note.path.slice(0, note.path.lastIndexOf("/") + 1) : "";
    if (!groups.has(folder)) groups.set(folder, []);
    groups.get(folder).push(note);
  }
  notesList.innerHTML = "";
  for (const folder of [...groups.keys()].sort()) {
    if (folder) {
      const heading = document.createElement("li");
      heading.className = "folder";
      heading.textContent = folder;
      notesList.appendChild(heading);
    }
    for (const note of groups.get(folder)) {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.textContent = note.title;
      const detail = document.createElement("small");
      detail.textContent = `${note.path.slice(folder.length)} · ${timeAgo(note.modified)}`;
      button.appendChild(detail);
      button.addEventListener("click", () => openNote(note.path));
      item.appendChild(button);
      notesList.appendChild(item);
    }
  }
}

async function openNote(path) {
  const response = await fetch(`/api/notes/${encodePath(path)}`);
  if (!response.ok) { listStatus.textContent = `Couldn't open ${path} (${response.status})`; return; }
  const {content} = await response.json();
  openEditor({path, content, etag: response.headers.get("ETag")});
}

function openEditor(note) {
  current = {...note, saved: note.content};
  editorPath.value = note.path;
  editor.value = note.content;
  editorStatus.textContent = "";
  document.getElementById("delete").hidden = note.etag === null;
  listPane.hidden = true;
  editorPane.hidden = false;
  (note.etag === null ? editorPath : editor).focus();
}

function closeEditor() {
  current = null;
  editorPane.hidden = true;
  listPane.hidden = false;
}

function confirmDiscard() {
  const unchanged = !current || (editor.value === current.saved && editorPath.value.trim() === current.path);
  return unchanged || confirm("Discard unsaved changes?");
}

function showConflict(message) {
  editorStatus.textContent = `${message} `;
  const reload = document.createElement("button");
  reload.textContent = "Reload (loses your edits)";
  reload.addEventListener("click", () => openNote(current.path));
  editorStatus.appendChild(reload);
}

// Explain a failed move or save in the editor's status line.
async function reportFailure(response, action) {
  if (response.status === 409) {
    const {error} = await response.json();
    if (error === "DestinationExists" || !current.etag) {
      editorStatus.textContent = "A note with that name already exists.";
    } else {
      showConflict("This note changed somewhere else since you opened it.");
    }
  } else if (response.status === 400) {
    editorStatus.textContent = "Invalid name. Use something like training/plan.md.";
  } else {
    editorStatus.textContent = `${action} failed (${response.status}).`;
  }
}

document.getElementById("save").addEventListener("click", async () => {
  let path = editorPath.value.trim();
  if (!path) { editorStatus.textContent = "Give the note a name first."; return; }
  if (!path.endsWith(".md")) path += ".md";
  let moved = false;

  // A changed path on an existing note is a move: one atomic rename on the
  // server, so the note is never in both places or lost.
  if (current.etag && path !== current.path) {
    const response = await fetch("/api/notes/move", {
      method: "POST",
      headers: {"Content-Type": "application/json", "If-Match": current.etag},
      body: JSON.stringify({from: current.path, to: path}),
    });
    if (!response.ok) { await reportFailure(response, "Move"); return; }
    current = {...current, path, etag: response.headers.get("ETag")};
    editorPath.value = path;
    moved = true;
  }

  if (current.etag && editor.value === current.saved) {
    editorStatus.textContent = moved ? "Moved" : "No changes";
    return;
  }
  // Optimistic concurrency: say which version we're replacing (If-Match), or
  // that the note must not exist yet (If-None-Match: *). The server answers
  // 409 if someone else changed it in the meantime, instead of overwriting.
  const precondition = current.etag ? {"If-Match": current.etag} : {"If-None-Match": "*"};
  const response = await fetch(`/api/notes/${encodePath(path)}`, {
    method: "PUT",
    headers: {"Content-Type": "application/json", ...precondition},
    body: JSON.stringify({content: editor.value}),
  });
  if (response.ok) {
    current = {path, etag: response.headers.get("ETag"), saved: editor.value};
    editorPath.value = path;
    document.getElementById("delete").hidden = false;
    editorStatus.textContent = moved ? "Moved and saved" : "Saved";
  } else {
    // If this happens after a move, the move stands; only the text edit
    // needs retrying.
    await reportFailure(response, moved ? "Moved, but saving your edits" : "Save");
  }
});

document.getElementById("delete").addEventListener("click", async () => {
  if (!confirm(`Delete ${current.path}? You can still recover it from the notes' git history.`)) return;
  const response = await fetch(`/api/notes/${encodePath(current.path)}`, {
    method: "DELETE",
    headers: {"If-Match": current.etag},
  });
  if (response.ok) { closeEditor(); loadNotes(); }
  else if (response.status === 409) showConflict("This note changed somewhere else; not deleted.");
  else editorStatus.textContent = `Delete failed (${response.status}).`;
});

document.getElementById("back").addEventListener("click", () => {
  if (confirmDiscard()) { closeEditor(); loadNotes(); }
});

document.getElementById("journal-form").addEventListener("submit", async event => {
  event.preventDefault();
  const journalInput = document.getElementById("journal-input");
  const text = journalInput.value.trim();
  if (!text) return;
  const response = await fetch("/api/journal", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({text}),
  });
  if (response.ok) {
    journalInput.value = "";
    listStatus.textContent = `Added to ${(await response.json()).path}`;
    loadNotes();
  } else {
    listStatus.textContent = `Couldn't add entry (${response.status}).`;
  }
});

// Resume the conversation this browser was last in.
let savedConversation = null;
try { savedConversation = localStorage.getItem("conversationId"); } catch {}
if (savedConversation) openConversation(savedConversation);
</script>
</body>
</html>
